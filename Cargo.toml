[workspace]
resolver = "2"
members = [
    "crates/elaris-cli",
    "crates/elaris-core",
    "crates/elaris-app",
    "crates/elaris-brand",
    "crates/elaris-shell",
    "crates/elaris-performance",
    "crates/elaris-performance-ui",
    "crates/elaris-presentation-broker",
    "crates/elaris-presentation-ipc",
    "crates/elaris-storage",
    "crates/elaris-sound",
]
exclude = [
    "Engine/Libraries/LibJS/Flap",
    "crates/gpui-motion",
    "vendor/gpui-ce",
]

[patch.crates-io]
# Keep the fork's optional GPUI adapter on the exact vendored native element types.
gpui-ce = { path = "vendor/gpui-ce/crates/gpui" }

[workspace.package]
edition = "2024"
license = "BSD-2-Clause"
version = "0.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
# Nothing outside tests catches unwinds, and panics cannot cross the C ABI.
panic = "abort"
