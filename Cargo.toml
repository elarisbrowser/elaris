[package]
name = "elaris"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.88"

[dependencies.rune]
git = "https://github.com/anomalyco/rune"
rev = "cca5df6fafb4721d96fe105f126ebfd2ec351bb6"
default-features = false
features = ["accessibility", "embedded-fonts", "metal-backend"]

[features]
ladybird-bridge = []

[[example]]
name = "ladybird_smoke"
required-features = ["ladybird-bridge"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"

# Rune needs its matching patched platform and text crates when used outside its workspace.
[patch.crates-io.parley_engine]
git = "https://github.com/anomalyco/rune"
rev = "cca5df6fafb4721d96fe105f126ebfd2ec351bb6"
package = "parley_engine"

[patch.crates-io.winit]
git = "https://github.com/anomalyco/rune"
rev = "cca5df6fafb4721d96fe105f126ebfd2ec351bb6"
package = "winit"
