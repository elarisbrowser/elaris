[workspace]
resolver = "3"
members = ["crates/elaris-app"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
rune = {
    git = "https://github.com/anomalyco/rune",
    rev = "cca5df6fafb4721d96fe105f126ebfd2ec351bb6",
    default-features = false,
    features = ["accessibility", "embedded-fonts", "metal-backend"],
}

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"

# Rune needs its matching patched platform and text crates when used outside its workspace.
[patch.crates-io]
parley_engine = {
    git = "https://github.com/anomalyco/rune",
    rev = "cca5df6fafb4721d96fe105f126ebfd2ec351bb6",
    package = "parley_engine",
}
winit = {
    git = "https://github.com/anomalyco/rune",
    rev = "cca5df6fafb4721d96fe105f126ebfd2ec351bb6",
    package = "winit",
}
