[package]
name = "elaris"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.88"

[dependencies.rune]
git = "https://github.com/anomalyco/rune"
rev = "cca5df6fafb4721d96fe105f126ebfd2ec351bb6"
default-features = false
features = ["accessibility", "embedded-fonts", "metal-backend", "svg", "tooling"]

[dependencies.rune-kit]
git = "https://github.com/anomalyco/rune"
rev = "cca5df6fafb4721d96fe105f126ebfd2ec351bb6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2_05 = { package = "objc2", version = "0.5.3" }
objc2_foundation_02 = { package = "objc2-foundation", version = "0.2.2" }

[target.'cfg(target_os = "macos")'.dependencies.objc2_app_kit_02]
package = "objc2-app-kit"
version = "0.2.2"
features = [
    "NSAnimation",
    "NSAnimationContext",
    "NSButton",
    "NSEvent",
    "NSResponder",
    "NSTrackingArea",
    "NSView",
    "NSWindow",
]

[features]
hot = ["rune/hot"]
ladybird-bridge = []

[[example]]
name = "ladybird_smoke"
required-features = ["ladybird-bridge"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"

# Keep Elaris easy to debug while reducing the cold-start cost of its large UI dependencies.
[profile.dev.package."*"]
opt-level = 1

# Rune needs its matching patched platform and text crates when used outside its workspace.
[patch.crates-io.parley_engine]
git = "https://github.com/anomalyco/rune"
rev = "cca5df6fafb4721d96fe105f126ebfd2ec351bb6"
package = "parley_engine"

[patch.crates-io.winit]
git = "https://github.com/anomalyco/rune"
rev = "cca5df6fafb4721d96fe105f126ebfd2ec351bb6"
package = "winit"
