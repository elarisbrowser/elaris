[workspace]
members = ["crates/elaris-core"]
default-members = [".", "crates/elaris-core"]
resolver = "3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"

[package]
name = "elaris"
version = "0.1.0-alpha.1"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.89"

[dependencies.rune]
git = "https://github.com/elarisbrowser/rune"
rev = "98873510c05d73fc2fe706721c8e20181324b6c2"
default-features = false
features = ["accessibility", "embedded-fonts", "metal-backend", "native-file-dialog", "svg", "tooling"]

[dependencies.rune-kit]
git = "https://github.com/elarisbrowser/rune"
rev = "98873510c05d73fc2fe706721c8e20181324b6c2"

[dependencies.elaris-core]
path = "crates/elaris-core"

[dev-dependencies.rusqlite]
version = "0.32"
features = ["bundled"]

[dependencies.serde]
version = "1"
features = ["derive", "rc"]

[dependencies.serde_json]
version = "1"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.5.1"
objc2_05 = { package = "objc2", version = "0.5.3" }
objc2_foundation_02 = { package = "objc2-foundation", version = "0.2.2", features = ["NSArray", "NSBundle", "NSError", "NSGeometry", "NSString", "NSURL"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13.2", features = ["randr"] }

[target.'cfg(target_os = "macos")'.dependencies.objc2_app_kit_02]
package = "objc2-app-kit"
version = "0.2.2"
features = [
    "NSAnimation",
    "NSApplication",
    "NSAnimationContext",
    "NSAccessibilityProtocols",
    "NSAppearance",
    "NSButton",
    "NSButtonCell",
    "NSBox",
    "NSColor",
    "NSCell",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSImage",
    "NSImageView",
    "NSMenu",
    "NSMenuItem",
    "block2",
    "NSParagraphStyle",
    "NSScreen",
    "NSResponder",
    "NSPopover",
    "NSTextField",
    "NSTrackingArea",
    "NSView",
    "NSViewController",
    "NSWindow",
    "NSWorkspace",
]

[features]
hot = ["rune/hot"]
# Shows the Linux window layout on any platform, for previewing it on macOS.
linux-ui = []
ladybird-bridge = ["elaris-core/ladybird-bridge"]

[[example]]
name = "ladybird_smoke"
required-features = ["ladybird-bridge"]

[[example]]
name = "ladybird_permissions"
required-features = ["ladybird-bridge"]

[lints]
workspace = true

# Keep Elaris easy to debug while reducing the cold-start cost of its large UI dependencies.
[profile.dev.package."*"]
opt-level = 1

# Rune needs its matching graphics, platform, accessibility, and text patches outside its workspace.
[patch.crates-io.wgpu-hal]
git = "https://github.com/elarisbrowser/rune"
rev = "98873510c05d73fc2fe706721c8e20181324b6c2"

[patch.crates-io.parley_engine]
git = "https://github.com/elarisbrowser/rune"
rev = "98873510c05d73fc2fe706721c8e20181324b6c2"
package = "parley_engine"

[patch.crates-io.sctk-adwaita]
git = "https://github.com/elarisbrowser/rune"
rev = "98873510c05d73fc2fe706721c8e20181324b6c2"

[patch.crates-io.accesskit_windows]
git = "https://github.com/elarisbrowser/rune"
rev = "98873510c05d73fc2fe706721c8e20181324b6c2"

[patch.crates-io.accesskit_macos]
git = "https://github.com/elarisbrowser/rune"
rev = "98873510c05d73fc2fe706721c8e20181324b6c2"

[patch.crates-io.winit]
git = "https://github.com/elarisbrowser/rune"
rev = "98873510c05d73fc2fe706721c8e20181324b6c2"
package = "winit"
