<!doctype html>
<!-- A box moved by script on every animation frame: main-thread-driven frames. -->
<title>JS animation</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  #box { position: absolute; top: 100px; width: 120px; height: 120px; background: #c36; }
</style>
<p>JS requestAnimationFrame animation</p>
<div id="box"></div>
<script>
  const start = performance.now();
  function step(now) {
    box.style.left = 300 + 280 * Math.sin((now - start) / 400) + "px";
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
</script>
