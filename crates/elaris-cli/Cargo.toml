[package]
name = "elaris-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "elaris"

[[bin]]
name = "elaris"
path = "src/main.rs"

[[bin]]
name = "el"
path = "src/el.rs"

[dependencies]
elaris-brand = { path = "../elaris-brand" }
libc = "0.2"
clap = { version = "4.6.7", features = ["derive", "wrap_help"] }
indicatif = "0.18.6"
owo-colors = { version = "4.4.0", features = ["supports-colors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"
