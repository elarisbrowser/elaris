name: PR 240 native bridge validation

on:
  push:
    branches:
      - ci-pr-240-native

permissions:
  contents: read

concurrency:
  group: ladybird-bridge-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-bridge:
    name: Recheck previously compiled native bridge
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/ladybirdbrowser/ladybird-ci:2026.11.12@sha256:85d78805ed766a8cd8f7188a2229bc6fc95b764b2d5a149bbbcb87a13d28b619
      options: --init
    timeout-minutes: 15
    steps:
      - name: Check out Elaris and pinned Ladybird
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore the exact build that passed both smoke tests
        id: prior-build
        uses: actions/cache/restore@v4
        with:
          path: |
            vendor/ladybird/Build/release
            build/cpp-ladybird
            target
          key: ladybird-bridge-linux-build-2026.11.12-9ba7d5c60a951648a32c29cee8a63b5bef8185f0e6054e87f95de2fd1c636f6d-45652812324-1
          fail-on-cache-miss: true
      - name: Prepare smoke test runtime
        env:
          EXACT_BUILD: ${{ steps.prior-build.outputs.cache-hit }}
        run: |
          test "$EXACT_BUILD" = true || { echo "The previously tested build cache is unavailable"; exit 1; }
          test -x build/cpp-ladybird/bin/elaris_ladybird_smoke
          test -x build/cpp-ladybird/bin/elaris_ladybird_download_smoke
          command -v xvfb-run
          apt-get update -o APT::Update::Error-Mode=any
          apt-get install -y --no-install-recommends libxkbcommon0
          rm -rf -- build/cpp-ladybird/elaris-smoke-profile build/cpp-ladybird/elaris-download-smoke

      - name: Run C++ bridge integration smoke tests
        timeout-minutes: 5
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run --auto-servernum --error-file=/tmp/elaris-xvfb.log ctest --test-dir build/cpp-ladybird --output-on-failure --timeout 120 -R '^elaris_ladybird_(smoke|download_smoke)$'

      - name: Check C++ smoke tests left no Ladybird helpers
        timeout-minutes: 2
        run: |
          sleep 1
          if ps -eo pid=,ppid=,stat=,comm= | grep -E '[[:space:]](WebContent|RequestServer|Hub|ImageDecoder|Compositor|SystemProbe|AudioServer|MediaServer|VideoDecoderS|WebRTCClient|ProcessReaper)$'; then
            echo "Ladybird helper process remained after C++ smoke tests" >&2
            exit 1
          fi

      - name: Upload native test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p240-native-smoke-logs
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/cpp-ladybird/Testing/Temporary/LastTest.log
            /tmp/elaris-xvfb.log
