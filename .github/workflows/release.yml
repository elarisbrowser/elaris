name: Release

# Builds the macOS and Linux app bundles, each with Ladybird's engine, and publishes them as a draft pre-release.
# Pushing a tag such as v0.1.0-alpha.1 runs it; workflow_dispatch runs it for a branch without publishing.
# The nightly workflow calls it with channel "canary", which publishes the rolling canary pre-release instead.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      signing_mode:
        description: "Use credential-free packaging preparation or exercise a signed release on main"
        type: choice
        options:
          - test
          - release
        default: test
        required: true
  workflow_call:
    inputs:
      channel:
        description: "stable for tagged releases, canary for the nightly build"
        type: string
        default: stable

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release sources
    runs-on: ubuntu-24.04
    outputs:
      release_route: ${{ steps.route.outputs.release_route }}
    steps:
      - name: Select release route
        id: route
        shell: bash
        env:
          RELEASE_CHANNEL: ${{ inputs.channel }}
          SIGNING_MODE: ${{ inputs.signing_mode }}
        run: |
          # Reusable workflows see the caller's event, not workflow_call.
          if [[ "$RELEASE_CHANNEL" == canary ]]; then
            test "$GITHUB_REF" = refs/heads/main || {
              echo "Signed canary builds may only run from trusted main." >&2
              exit 1
            }
            route=canary
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            route=tag
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$SIGNING_MODE" == release ]]; then
            test "$GITHUB_REF" = refs/heads/main || {
              echo "Signed manual builds may only run from trusted main." >&2
              exit 1
            }
            route=signed-test
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$SIGNING_MODE" == test ]]; then
            route=unsigned-test
          else
            echo "Unsupported release inputs." >&2
            exit 1
          fi
          echo "release_route=$route" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - name: Check formatting, Clippy and tests
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Test release engine cache routing and manifest validation
        run: python3 -m unittest tools.tests.test_release_engine tools.tests.test_release_app
      - name: Test macOS signing and publication safeguards
        run: python3 -m unittest discover -s tools/tests -p test_macos_signing.py

  macos:
    name: macOS bundle (Apple Silicon)
    needs: verify
    runs-on: macos-26
    timeout-minutes: 300
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      ELARIS_BASELINE_CPU: "1"
      CCACHE_COMPILERCHECK: content
      # Hash preprocessed inputs: new or removed headers must invalidate previous results too.
      CCACHE_NODIRECT: "true"
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify version tag points to main history
        if: needs.verify.outputs.release_route == 'tag'
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --no-tags --unshallow origin main
          else
            git fetch --no-tags origin main
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD || {
            echo "A signed version tag must point to a commit contained in main." >&2
            exit 1
          }

      - name: Require Xcode 26 or newer
        run: |
          version="$(xcodebuild -version | awk '/^Xcode/ {print $2}')"
          echo "Xcode ${version}"
          test "$(printf '%s\n26\n' "${version%%.*}" | sort -n | head -1)" = "26" || {
            echo "Xcode 26 or newer is required" >&2
            exit 1
          }

      - name: Set up Elaris and Ladybird
        run: ./elaris setup

      - name: Identify the native cache toolchain
        id: native-cache-key
        shell: bash
        run: |
          toolchain="$({
            set -e
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-build-version
            sw_vers -buildVersion
            ccache --version
          } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "prefix=release-native-v1-${RUNNER_OS}-${RUNNER_ARCH}-${ELARIS_BASELINE_CPU}-${toolchain}" >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.release-ccache" >> "$GITHUB_ENV"

      - name: Restore Ladybird compiler and vcpkg archives
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .release-ccache
            .git/modules/Build/caches/vcpkg-binary-cache
          key: ${{ steps.native-cache-key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.native-cache-key.outputs.prefix }}-

      - name: Name this build
        id: version
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$CHANNEL" = canary ]; then
            version="canary-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          else
            version="${GITHUB_REF_NAME:-dev}"
          fi
          echo "ELARIS_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Identify exact Ladybird build inputs
        id: engine-key
        run: |
          key="$(python3 -m tools.elaris_cli.release_engine prepare)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore exact Ladybird release outputs
        id: engine-cache
        if: ${{ steps.engine-key.outputs.key != '' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: build/release-engine-cache
          key: ${{ steps.engine-key.outputs.key }}

      - name: Identify exact Elaris executable inputs
        id: app-key
        if: ${{ steps.engine-key.outputs.key != '' }}
        shell: bash
        env:
          ENGINE_KEY: ${{ steps.engine-key.outputs.key }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -n "${HOME:-}" ] && [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          channel_args=()
          if [ "$CHANNEL" = canary ]; then
            channel_args+=(--canary)
          fi
          key="$("${ELARIS_PYTHON:-python3}" -m tools.elaris_cli.release_app "$ENGINE_KEY" "${channel_args[@]}")"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore exact Elaris executable
        id: app-cache
        if: ${{ steps.app-key.outputs.key != '' && steps.engine-cache.outputs.cache-hit == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: build/release-app-cache
          key: ${{ steps.app-key.outputs.key }}

      - name: Build and bundle Elaris
        id: bundle
        shell: bash
        env:
          ENGINE_KEY: ${{ steps.engine-key.outputs.key }}
          ENGINE_CACHE_HIT: ${{ steps.engine-cache.outputs.cache-hit }}
          APP_KEY: ${{ steps.app-key.outputs.key }}
          APP_CACHE_HIT: ${{ steps.app-cache.outputs.cache-hit }}
        run: |
          ccache --zero-stats
          cache_args=()
          if [ -n "$ENGINE_KEY" ]; then
            cache_args+=(--release-engine-cache-key "$ENGINE_KEY")
          fi
          if [ "$ENGINE_CACHE_HIT" = true ]; then
            cache_args+=(--release-engine-cache-hit)
          fi
          if [ -n "$APP_KEY" ]; then
            cache_args+=(--release-app-cache-key "$APP_KEY")
          fi
          if [ "$APP_CACHE_HIT" = true ]; then
            cache_args+=(--release-app-cache-hit)
          fi
          ./elaris bundle "${cache_args[@]}" ${{ inputs.channel == 'canary' && '--canary' || '' }}

      - name: Report compiler cache hits
        if: ${{ always() && (steps.bundle.outcome == 'success' || steps.bundle.outcome == 'failure') }}
        continue-on-error: true
        run: ccache --show-stats

      - name: Save Ladybird compiler and vcpkg archives
        # Avoid uploading another large compiler cache when no native build was needed.
        if: ${{ always() && steps.engine-cache.outputs.cache-hit != 'true' && (steps.bundle.outcome == 'success' || steps.bundle.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: |
            .release-ccache
            .git/modules/Build/caches/vcpkg-binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Verify the bundle is self-contained
        run: |
          app=build/Elaris.app
          codesign --verify --strict "$app"
          plutil -lint "$app/Contents/Info.plist"
          if otool -l "$app/Contents/MacOS/elaris" | grep -q "$GITHUB_WORKSPACE"; then
            echo "The bundle still points into the build tree" >&2
            exit 1
          fi

      - name: Smoke test Ladybird runtime and helper processes on a native build
        run: |
          # Exact engine archives contain runtime outputs, not CMake or CTest state.
          if ! grep -qx 'Native engine: reused exact output' build/release-engine-info.txt 2>/dev/null; then
            ctest --test-dir build/cpp-ladybird --output-on-failure --no-tests=error -R '^elaris_ladybird_(smoke|engine_features|download_smoke)$'
          fi

      - name: Smoke test the packaged browser
        timeout-minutes: 5
        run: |
          relocated="$RUNNER_TEMP/Elaris.app"
          ditto build/Elaris.app "$relocated"
          python3 packaging/macos/signing.py smoke --app "$relocated"

      - name: Save verified Ladybird release outputs
        if: ${{ steps.engine-key.outputs.key != '' && steps.engine-cache.outputs.cache-hit != 'true' && hashFiles('build/release-engine-cache/manifest.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/release-engine-cache
          key: ${{ steps.engine-key.outputs.key }}

      - name: Save verified Elaris executable
        if: ${{ steps.app-key.outputs.key != '' && steps.app-cache.outputs.cache-hit != 'true' && hashFiles('build/release-app-cache/manifest.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/release-app-cache
          key: ${{ steps.app-key.outputs.key }}

      - name: Stage production release entitlements and inspect signing plan
        run: |
          mkdir -p build/signing-entitlements
          count=0
          for source in build/cpp-ladybird/Services/*/*.release.entitlements; do
            [ -f "$source" ] || continue
            name="$(basename "$source" .release.entitlements)"
            cp "$source" "build/signing-entitlements/$name.entitlements"
            count=$((count + 1))
          done
          test "$count" -gt 0 || {
            echo "Ladybird did not produce release entitlements" >&2
            exit 1
          }
          python3 packaging/macos/signing.py prepare \
            --app build/Elaris.app \
            --entitlements-dir build/signing-entitlements
          cat > build/BUILD-INFO.txt <<EOF
          Elaris ${ELARIS_VERSION} (macOS arm64)
          Elaris commit: ${GITHUB_SHA}
          Ladybird commit: $(git rev-parse HEAD:vendor/ladybird)
          Rune revision: $(grep -m1 'rev = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          Xcode: $(xcodebuild -version | tr '\n' ' ')
          EOF
          if [ -f build/release-engine-info.txt ]; then
            cat build/release-engine-info.txt >> build/BUILD-INFO.txt
          else
            echo "Native engine: built natively (exact cache unavailable)" >> build/BUILD-INFO.txt
          fi
          if [ -f build/release-app-info.txt ]; then
            cat build/release-app-info.txt >> build/BUILD-INFO.txt
          else
            echo "Elaris executable: built with Cargo (exact cache unavailable)" >> build/BUILD-INFO.txt
          fi

      - name: Package an unsigned test image
        if: needs.verify.outputs.release_route == 'unsigned-test'
        run: |
          mkdir -p dist
          brew install create-dmg
          image="dist/Elaris-${ELARIS_VERSION}-macos-arm64-unsigned-test.dmg"
          packaging/macos/make-dmg.sh build/Elaris.app "$image" Elaris
          echo "Package status: unsigned development test image; not for distribution" > dist/BUILD-INFO.txt
          cat build/BUILD-INFO.txt >> dist/BUILD-INFO.txt
          cp dist/BUILD-INFO.txt "dist/Elaris-${ELARIS_VERSION}-macos-arm64-unsigned-test.BUILD-INFO.txt"

      - name: Upload the credential-free test package
        if: needs.verify.outputs.release_route == 'unsigned-test'
        uses: actions/upload-artifact@v4
        with:
          name: elaris-macos-arm64-test
          path: dist/
          if-no-files-found: error
          retention-days: 3

      - name: Archive the app and its release entitlements for the signing job
        if: contains(fromJSON('["canary", "tag", "signed-test"]'), needs.verify.outputs.release_route)
        run: tar -cf "$RUNNER_TEMP/elaris-macos-signing-input.tar" -C build Elaris.app signing-entitlements BUILD-INFO.txt

      - name: Upload the short-lived signing input
        if: contains(fromJSON('["canary", "tag", "signed-test"]'), needs.verify.outputs.release_route)
        uses: actions/upload-artifact@v4
        with:
          name: elaris-macos-signing-input
          path: ${{ runner.temp }}/elaris-macos-signing-input.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  macos-sign:
    name: Sign and notarize macOS release
    needs: [verify, macos]
    if: contains(fromJSON('["canary", "tag", "signed-test"]'), needs.verify.outputs.release_route)
    runs-on: macos-26
    timeout-minutes: 90
    environment: apple-signing
    env:
      ELARIS_VERSION: ${{ needs.macos.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: elaris-macos-signing-input
          path: ${{ runner.temp }}/signing-input

      - name: Restore the assembled app and release entitlements
        run: |
          mkdir -p build
          tar -xf "$RUNNER_TEMP/signing-input/elaris-macos-signing-input.tar" -C build

      - name: Prepare release metadata
        run: mkdir -p dist && cp build/BUILD-INFO.txt dist/BUILD-INFO.txt

      - name: Install DMG packaging tool
        run: brew install create-dmg

      - name: Sign, package, notarize, staple and verify
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          python3 packaging/macos/signing.py release \
            --app build/Elaris.app \
            --entitlements-dir build/signing-entitlements \
            --dmg "dist/Elaris-${ELARIS_VERSION}-macos-arm64.dmg" \
            --volume-name Elaris

      - name: Verify release files before upload
        run: python3 packaging/macos/verify_release_artifacts.py --directory dist

      - uses: actions/upload-artifact@v4
        with:
          name: elaris-macos-arm64-signed
          path: dist/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux bundle (x86_64)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ELARIS_BASELINE_CPU: "1"
      CCACHE_COMPILERCHECK: content
      # Hash preprocessed inputs: new or removed headers must invalidate previous results too.
      CCACHE_NODIRECT: "true"
      CCACHE_MAXSIZE: 2G
      CCACHE_DIR: ${{ github.workspace }}/.release-ccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install bundling and headless test tools
        run: |
          sudo apt-get update -o APT::Update::Error-Mode=any
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1 ccache

      # Ladybird needs Qt >= 6.10 to configure its Linux helpers; Noble's system Qt is older.
      - name: Install Qt 6.10.3 for Ladybird
        id: qt
        uses: jurplel/install-qt-action@b344308e4483fc892e0d27b3cd1b173ebdd95f06 # v4.5.0
        with:
          version: '6.10.3'
          host: linux
          arch: linux_gcc_64
          modules: qtpositioning
          archives: qtbase icu
          aqtversion: '==3.3.0'
          install-deps: 'false'
          setup-python: 'false'
          set-env: 'false'

      - name: Name this build
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$CHANNEL" = canary ]; then
            echo "ELARIS_VERSION=canary-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "ELARIS_VERSION=${GITHUB_REF_NAME:-dev}" >> "$GITHUB_ENV"
          fi

      - name: Set up Elaris and Ladybird
        env:
          QT_SDK: ${{ steps.qt.outputs.qt-root-dir }}
        shell: bash
        run: |
          export PKG_CONFIG_PATH="$QT_SDK/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export CMAKE_PREFIX_PATH="$QT_SDK${CMAKE_PREFIX_PATH:+:$CMAKE_PREFIX_PATH}"
          test "$(pkg-config --modversion Qt6Core)" = 6.10.3
          pcdir="$(pkg-config --variable=pcfiledir Qt6Core)"
          test "${pcdir//\\ / }" -ef "$QT_SDK/lib/pkgconfig"
          ./elaris setup

          # Direct bridge CMake otherwise defaults to Noble's GCC 13, even when setup finds LLVM 22.
          export CC=/usr/bin/clang-22 CXX=/usr/bin/clang++-22
          for compiler in "$CC" "$CXX"; do
            test "$("$compiler" -dumpversion | cut -d. -f1)" = 22
            "$compiler" --version
          done

          probe="$(mktemp -d "$RUNNER_TEMP/qt-check.XXXXXX")"
          cat > "$probe/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.30)
          project(ElarisReleaseProbe LANGUAGES C CXX)
          foreach(language C CXX)
              if(NOT CMAKE_${language}_COMPILER_ID STREQUAL "Clang" OR NOT CMAKE_${language}_COMPILER_VERSION MATCHES "^22[.]")
                  message(FATAL_ERROR "Elaris Release did not select Clang 22 for ${language}")
              endif()
          endforeach()
          include(CheckCXXSourceCompiles)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          check_cxx_source_compiles([[
              struct Probe { constexpr int value(this const Probe&) { return 42; } };
              static_assert(Probe{}.value() == 42);
              int main() {}
          ]] ELARIS_HAS_EXPLICIT_OBJECT_PARAMETER)
          if(NOT ELARIS_HAS_EXPLICIT_OBJECT_PARAMETER)
              message(FATAL_ERROR "The Linux compiler does not support C++23 explicit object parameters")
          endif()
          find_package(Qt6 6.10.3 EXACT REQUIRED COMPONENTS Core Gui Widgets Positioning)
          foreach(package Qt6 Qt6Core Qt6Gui Qt6Widgets Qt6Positioning)
              if(NOT "${${package}_DIR}" STREQUAL "$ENV{QT_SDK}/lib/cmake/${package}")
                  message(FATAL_ERROR "${package} was not resolved from the installed Qt SDK")
              endif()
          endforeach()
          EOF
          cmake -S "$probe" -B "$probe/build"
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH" >> "$GITHUB_ENV"
          echo "CC=$CC" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"

      - name: Identify the native cache toolchain
        id: native-cache-key
        shell: bash
        run: |
          toolchain="$({
            set -e
            cat /etc/os-release
            "$CC" --version
            "$CXX" --version
            ccache --version
          } | sha256sum | cut -d ' ' -f 1)"
          echo "prefix=release-native-v1-${RUNNER_OS}-${RUNNER_ARCH}-${ELARIS_BASELINE_CPU}-${toolchain}" >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.release-ccache" >> "$GITHUB_ENV"

      - name: Restore Ladybird compiler and vcpkg archives
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .release-ccache
            .git/modules/Build/caches/vcpkg-binary-cache
          key: ${{ steps.native-cache-key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.native-cache-key.outputs.prefix }}-

      - name: Identify exact Ladybird build inputs
        id: engine-key
        shell: bash
        run: |
          # Match ./elaris so the cache key and bundle resolve the same toolchain.
          if [ -n "${HOME:-}" ] && [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          key="$("${ELARIS_PYTHON:-python3}" -m tools.elaris_cli.release_engine prepare)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore exact Ladybird release outputs
        id: engine-cache
        if: ${{ steps.engine-key.outputs.key != '' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: build/release-engine-cache
          key: ${{ steps.engine-key.outputs.key }}

      - name: Identify exact Elaris executable inputs
        id: app-key
        if: ${{ steps.engine-key.outputs.key != '' }}
        shell: bash
        env:
          ENGINE_KEY: ${{ steps.engine-key.outputs.key }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ -n "${HOME:-}" ] && [ -f "$HOME/.cargo/env" ]; then
            . "$HOME/.cargo/env"
          fi
          channel_args=()
          if [ "$CHANNEL" = canary ]; then
            channel_args+=(--canary)
          fi
          key="$("${ELARIS_PYTHON:-python3}" -m tools.elaris_cli.release_app "$ENGINE_KEY" "${channel_args[@]}")"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore exact Elaris executable
        id: app-cache
        if: ${{ steps.app-key.outputs.key != '' && steps.engine-cache.outputs.cache-hit == 'true' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: build/release-app-cache
          key: ${{ steps.app-key.outputs.key }}

      - name: Build and bundle Elaris
        id: bundle
        shell: bash
        env:
          ENGINE_KEY: ${{ steps.engine-key.outputs.key }}
          ENGINE_CACHE_HIT: ${{ steps.engine-cache.outputs.cache-hit }}
          APP_KEY: ${{ steps.app-key.outputs.key }}
          APP_CACHE_HIT: ${{ steps.app-cache.outputs.cache-hit }}
        run: |
          ccache --zero-stats
          cache_args=()
          if [ -n "$ENGINE_KEY" ]; then
            cache_args+=(--release-engine-cache-key "$ENGINE_KEY")
          fi
          if [ "$ENGINE_CACHE_HIT" = true ] && [ -d build/release-engine-cache ]; then
            cache_args+=(--release-engine-cache-hit)
          fi
          if [ -n "$APP_KEY" ]; then
            cache_args+=(--release-app-cache-key "$APP_KEY")
          fi
          if [ "$APP_CACHE_HIT" = true ]; then
            cache_args+=(--release-app-cache-hit)
          fi
          ELARIS_JOBS=4 ./elaris bundle "${cache_args[@]}" ${{ inputs.channel == 'canary' && '--canary' || '' }}

      - name: Report compiler cache hits
        if: ${{ always() && (steps.bundle.outcome == 'success' || steps.bundle.outcome == 'failure') }}
        continue-on-error: true
        run: ccache --show-stats

      - name: Save Ladybird compiler and vcpkg archives
        # Avoid uploading another large compiler cache when no native build was needed.
        if: ${{ always() && steps.engine-cache.outputs.cache-hit != 'true' && (steps.bundle.outcome == 'success' || steps.bundle.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: |
            .release-ccache
            .git/modules/Build/caches/vcpkg-binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Smoke test the packaged browser
        run: |
          prefix=build/linux/Elaris
          # A copy outside the build tree proves the bundle does not depend on it.
          relocated="$RUNNER_TEMP/relocated"
          rm -rf "$relocated" && mkdir -p "$relocated" && cp -a "$prefix" "$relocated/Elaris"
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run --auto-servernum "$relocated/Elaris/bin/elaris" "file://$GITHUB_WORKSPACE/bridge/tests/smoke.html" -- --snap "$RUNNER_TEMP/smoke.png"
          test -s "$RUNNER_TEMP/smoke.png"

      - name: Check the Linux glibc baseline
        run: python3 packaging/linux/check-glibc-baseline.py build/linux/Elaris 2.39

      - name: Save verified Ladybird release outputs
        if: ${{ steps.engine-key.outputs.key != '' && steps.engine-cache.outputs.cache-hit != 'true' && hashFiles('build/release-engine-cache/manifest.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/release-engine-cache
          key: ${{ steps.engine-key.outputs.key }}

      - name: Save verified Elaris executable
        if: ${{ steps.app-key.outputs.key != '' && steps.app-cache.outputs.cache-hit != 'true' && hashFiles('build/release-app-cache/manifest.json') != '' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: build/release-app-cache
          key: ${{ steps.app-key.outputs.key }}

      - name: Package Linux archives and checksums
        run: |
          version="$ELARIS_VERSION"
          mkdir -p dist
          archive="dist/Elaris-${version}-linux-x86_64.tar.gz"
          image="dist/Elaris-${version}-linux-x86_64.AppImage"
          # Fixed owners, names and times, and no gzip name or time, so the same build always gives the same archive.
          epoch="$(git log -1 --format=%ct)"
          ladybird_revision="$(git rev-parse HEAD:vendor/ladybird)"
          tar -C build/linux --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${epoch}" -cf - Elaris | gzip -n > "$archive"
          cat > dist/BUILD-INFO.txt <<EOF
          Elaris ${version} (Linux x86_64)
          Elaris commit: ${GITHUB_SHA}
          Ladybird commit: ${ladybird_revision}
          Rune revision: $(grep -m1 'rev = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          Build host: $(. /etc/os-release; printf '%s' "$PRETTY_NAME")
          Build libc: $(getconf GNU_LIBC_VERSION)
          EOF
          if [ -f build/release-engine-info.txt ]; then
            cat build/release-engine-info.txt >> dist/BUILD-INFO.txt
          else
            echo "Native engine: built natively (exact cache unavailable)" >> dist/BUILD-INFO.txt
          fi
          if [ -f build/release-app-info.txt ]; then
            cat build/release-app-info.txt >> dist/BUILD-INFO.txt
          else
            echo "Elaris executable: built with Cargo (exact cache unavailable)" >> dist/BUILD-INFO.txt
          fi
          cp dist/BUILD-INFO.txt "dist/Elaris-${version}-linux-x86_64.BUILD-INFO.txt"
          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")

          tool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          curl --fail --location --retry 3 --output "$tool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          packaging/linux/make-appimage.sh build/linux/Elaris "$image" "$tool"
          (cd dist && sha256sum "$(basename "$image")" > "$(basename "$image").sha256")

          APPIMAGE_EXTRACT_AND_RUN=1 "$image" \
            "file://$GITHUB_WORKSPACE/bridge/tests/smoke.html" -- \
            --snap "$RUNNER_TEMP/appimage-smoke.png"
          test -s "$RUNNER_TEMP/appimage-smoke.png"

      - name: Keep the install prefix even if packaging failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elaris-linux-x86_64-build
          path: build/linux/Elaris
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: elaris-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish draft pre-release
    needs: [verify, macos-sign, linux]
    if: needs.verify.outputs.release_route == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: elaris-macos-arm64-signed
          path: dist/macos
      - uses: actions/download-artifact@v4
        with:
          name: elaris-linux-x86_64
          path: dist/linux

      - name: Require a notarized macOS release package
        run: python3 packaging/macos/verify_release_artifacts.py --directory dist/macos

      - name: Create a draft pre-release with the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          mac=(dist/macos/Elaris-*-macos-arm64.dmg)
          linux=(dist/linux/Elaris-*-linux-x86_64.tar.gz)
          appimage=(dist/linux/Elaris-*-linux-x86_64.AppImage)
          if (( ${#mac[@]} != 1 || ${#linux[@]} != 1 || ${#appimage[@]} != 1 )); then
            echo "Expected one macOS DMG, one Linux tarball and one Linux AppImage" >&2
            exit 1
          fi
          mac_package="${mac[0]}"
          linux_package="${linux[0]}"
          appimage_package="${appimage[0]}"
          assets=("$mac_package" "$mac_package.sha256" "${mac_package%.dmg}.BUILD-INFO.txt"
                  "$linux_package" "$linux_package.sha256" "${linux_package%.tar.gz}.BUILD-INFO.txt"
                  "$appimage_package" "$appimage_package.sha256" "${appimage_package%.AppImage}.BUILD-INFO.txt")
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" || ! -s "$asset" ]]; then
              echo "Missing or empty release asset: $asset" >&2
              exit 1
            fi
          done
          # Drafts stay private until someone checks the artifacts and publishes them by hand.
          gh release create "$TAG" "${assets[@]}" \
            --draft --prerelease \
            --title "Elaris ${TAG} (experimental alpha)" \
            --notes "Experimental alpha builds of Elaris. Each archive ships Ladybird's engine; see the platform's BUILD-INFO.txt file for the exact Elaris, Ladybird and Rune revisions and verify the .sha256 checksum before running."

  publish-canary:
    name: Publish rolling canary pre-release
    needs: [verify, macos-sign, linux]
    if: needs.verify.outputs.release_route == 'canary'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: elaris-macos-arm64-signed
          path: dist/macos
      - uses: actions/download-artifact@v4
        with:
          name: elaris-linux-x86_64
          path: dist/linux

      - name: Require a notarized macOS canary package
        run: python3 packaging/macos/verify_release_artifacts.py --directory dist/macos

      - name: Replace the canary pre-release with tonight's builds
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          shopt -s nullglob
          mac=(dist/macos/Elaris-*-macos-arm64.dmg)
          linux=(dist/linux/Elaris-*-linux-x86_64.tar.gz)
          appimage=(dist/linux/Elaris-*-linux-x86_64.AppImage)
          if (( ${#mac[@]} != 1 || ${#linux[@]} != 1 || ${#appimage[@]} != 1 )); then
            echo "Expected one macOS DMG, one Linux tarball and one Linux AppImage" >&2
            exit 1
          fi
          mac_package="${mac[0]}"
          linux_package="${linux[0]}"
          appimage_package="${appimage[0]}"
          assets=("$mac_package" "$mac_package.sha256" "${mac_package%.dmg}.BUILD-INFO.txt"
                  "$linux_package" "$linux_package.sha256" "${linux_package%.tar.gz}.BUILD-INFO.txt"
                  "$appimage_package" "$appimage_package.sha256" "${appimage_package%.AppImage}.BUILD-INFO.txt")
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" || ! -s "$asset" ]]; then
              echo "Missing or empty release asset: $asset" >&2
              exit 1
            fi
          done
          # The canary tag always names the newest build, so the previous one is replaced rather than kept.
          gh release delete canary --cleanup-tag --yes 2>/dev/null || true
          gh release create canary "${assets[@]}" \
            --target "$SHA" \
            --prerelease --latest=false \
            --title "Elaris canary ($(date -u +%Y-%m-%d))" \
            --notes "Built nightly from main at ${SHA:0:7}. Canary builds are unreleased and may break; they share the stable profile, so back up your data first. See the platform's BUILD-INFO.txt file for the exact revisions and verify the .sha256 checksum before running."
