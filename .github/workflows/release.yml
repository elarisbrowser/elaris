name: Release

# Builds the macOS and Linux app bundles, each with Ladybird's engine, and publishes them as a draft pre-release.
# Pushing a tag such as v0.1.0-alpha.1 runs it; workflow_dispatch runs it for a branch without publishing.
# The nightly workflow calls it with channel "canary", which publishes the rolling canary pre-release instead.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
  workflow_call:
    inputs:
      channel:
        description: "stable for tagged releases, canary for the nightly build"
        type: string
        default: stable

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - name: Check formatting, Clippy and tests
        run: |
          cargo fmt -- --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
      - name: Test release engine cache routing and manifest validation
        run: python3 -m unittest discover -s tools/tests -p test_release_engine.py

  macos:
    name: macOS bundle (Apple Silicon)
    needs: verify
    runs-on: macos-26
    timeout-minutes: 300
    env:
      ELARIS_BASELINE_CPU: "1"
      CCACHE_COMPILERCHECK: content
      # Hash preprocessed inputs: new or removed headers must invalidate previous results too.
      CCACHE_NODIRECT: "true"
      CCACHE_MAXSIZE: 2G
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Require Xcode 26 or newer
        run: |
          version="$(xcodebuild -version | awk '/^Xcode/ {print $2}')"
          echo "Xcode ${version}"
          test "$(printf '%s\n26\n' "${version%%.*}" | sort -n | head -1)" = "26" || {
            echo "Xcode 26 or newer is required" >&2
            exit 1
          }

      - name: Set up Elaris and Ladybird
        run: ./elaris setup

      - name: Identify the native cache toolchain
        id: native-cache-key
        shell: bash
        run: |
          toolchain="$({
            set -e
            xcodebuild -version
            xcrun --sdk macosx --show-sdk-build-version
            sw_vers -buildVersion
            ccache --version
          } | shasum -a 256 | cut -d ' ' -f 1)"
          echo "prefix=release-native-v1-${RUNNER_OS}-${RUNNER_ARCH}-${ELARIS_BASELINE_CPU}-${toolchain}" >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.release-ccache" >> "$GITHUB_ENV"

      - name: Restore Ladybird compiler and vcpkg archives
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .release-ccache
            .git/modules/Build/caches/vcpkg-binary-cache
          key: ${{ steps.native-cache-key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.native-cache-key.outputs.prefix }}-

      - name: Name this build
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$CHANNEL" = canary ]; then
            echo "ELARIS_VERSION=canary-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "ELARIS_VERSION=${GITHUB_REF_NAME:-dev}" >> "$GITHUB_ENV"
          fi

      - name: Identify exact Ladybird build inputs
        id: engine-key
        run: |
          key="$(python3 -m tools.elaris_cli.release_engine prepare)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore exact Ladybird release outputs
        id: engine-cache
        if: ${{ steps.engine-key.outputs.key != '' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: build/release-engine-cache
          key: ${{ steps.engine-key.outputs.key }}

      - name: Build and bundle Elaris
        id: bundle
        shell: bash
        env:
          ENGINE_KEY: ${{ steps.engine-key.outputs.key }}
          ENGINE_CACHE_HIT: ${{ steps.engine-cache.outputs.cache-hit }}
        run: |
          ccache --zero-stats
          cache_args=()
          if [ -n "$ENGINE_KEY" ]; then
            cache_args+=(--release-engine-cache-key "$ENGINE_KEY")
          fi
          if [ "$ENGINE_CACHE_HIT" = true ]; then
            cache_args+=(--release-engine-cache-hit)
          fi
          ./elaris bundle "${cache_args[@]}" ${{ inputs.channel == 'canary' && '--canary' || '' }}

      - name: Report compiler cache hits
        if: ${{ always() && (steps.bundle.outcome == 'success' || steps.bundle.outcome == 'failure') }}
        continue-on-error: true
        run: ccache --show-stats

      - name: Save Ladybird compiler and vcpkg archives
        # These caches validate content, so completed entries from an otherwise failed build are useful.
        if: ${{ always() && (steps.bundle.outcome == 'success' || steps.bundle.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: |
            .release-ccache
            .git/modules/Build/caches/vcpkg-binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Verify the bundle is self-contained
        run: |
          app=build/Elaris.app
          codesign --verify --deep --strict "$app"
          plutil -lint "$app/Contents/Info.plist"
          if otool -l "$app/Contents/MacOS/elaris" | grep -q "$GITHUB_WORKSPACE"; then
            echo "The bundle still points into the build tree" >&2
            exit 1
          fi

      - name: Save verified Ladybird release outputs
        if: ${{ steps.engine-key.outputs.key != '' && steps.engine-cache.outputs.cache-hit != 'true' && hashFiles('build/release-engine-cache/manifest.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: build/release-engine-cache
          key: ${{ steps.engine-key.outputs.key }}

      - name: Package a disk image and checksums
        run: |
          version="$ELARIS_VERSION"
          mkdir -p dist
          brew install create-dmg
          image="dist/Elaris-${version}-macos-arm64.dmg"
          packaging/macos/make-dmg.sh build/Elaris.app "$image" Elaris
          cat > dist/BUILD-INFO.txt <<EOF
          Elaris ${version} (macOS arm64)
          Elaris commit: ${GITHUB_SHA}
          Ladybird commit: $(git rev-parse HEAD:vendor/ladybird)
          Rune revision: $(grep -m1 'rev = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          Xcode: $(xcodebuild -version | tr '\n' ' ')
          EOF
          if [ -f build/release-engine-info.txt ]; then
            cat build/release-engine-info.txt >> dist/BUILD-INFO.txt
          else
            echo "Native engine: built natively (exact cache unavailable)" >> dist/BUILD-INFO.txt
          fi
          (cd dist && shasum -a 256 "$(basename "$image")" > "$(basename "$image").sha256")
          cp dist/BUILD-INFO.txt dist/Elaris-${version}-macos-arm64.BUILD-INFO.txt

      - name: Keep the app bundle even if packaging failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elaris-macos-arm64-build
          path: build/Elaris.app
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: elaris-macos-arm64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux bundle (x86_64)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ELARIS_BASELINE_CPU: "1"
      CCACHE_COMPILERCHECK: content
      # Hash preprocessed inputs: new or removed headers must invalidate previous results too.
      CCACHE_NODIRECT: "true"
      CCACHE_MAXSIZE: 2G
      CCACHE_DIR: ${{ github.workspace }}/.release-ccache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install bundling and headless test tools
        run: |
          sudo apt-get update -o APT::Update::Error-Mode=any
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libvulkan1 ccache

      - name: Identify the native cache toolchain
        id: native-cache-key
        shell: bash
        run: |
          toolchain="$({
            set -e
            cat /etc/os-release
            clang++ --version
            ccache --version
          } | sha256sum | cut -d ' ' -f 1)"
          echo "prefix=release-native-v1-${RUNNER_OS}-${RUNNER_ARCH}-${ELARIS_BASELINE_CPU}-${toolchain}" >> "$GITHUB_OUTPUT"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.release-ccache" >> "$GITHUB_ENV"

      - name: Restore Ladybird compiler and vcpkg archives
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .release-ccache
            .git/modules/Build/caches/vcpkg-binary-cache
          key: ${{ steps.native-cache-key.outputs.prefix }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ steps.native-cache-key.outputs.prefix }}-

      - name: Name this build
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$CHANNEL" = canary ]; then
            echo "ELARIS_VERSION=canary-$(date -u +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          else
            echo "ELARIS_VERSION=${GITHUB_REF_NAME:-dev}" >> "$GITHUB_ENV"
          fi

      - name: Set up Elaris and Ladybird
        run: ./elaris setup

      - name: Identify exact Ladybird build inputs
        id: engine-key
        run: |
          key="$(python3 -m tools.elaris_cli.release_engine prepare)"
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Restore exact Ladybird release outputs
        id: engine-cache
        if: ${{ steps.engine-key.outputs.key != '' }}
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: build/release-engine-cache
          key: ${{ steps.engine-key.outputs.key }}

      - name: Build and bundle Elaris
        id: bundle
        shell: bash
        env:
          ENGINE_KEY: ${{ steps.engine-key.outputs.key }}
          ENGINE_CACHE_HIT: ${{ steps.engine-cache.outputs.cache-hit }}
        run: |
          ccache --zero-stats
          cache_args=()
          if [ -n "$ENGINE_KEY" ]; then
            cache_args+=(--release-engine-cache-key "$ENGINE_KEY")
          fi
          if [ "$ENGINE_CACHE_HIT" = true ] && [ -d build/release-engine-cache ]; then
            cache_args+=(--release-engine-cache-hit)
          fi
          ELARIS_JOBS=4 ./elaris bundle "${cache_args[@]}" ${{ inputs.channel == 'canary' && '--canary' || '' }}

      - name: Report compiler cache hits
        if: ${{ always() && (steps.bundle.outcome == 'success' || steps.bundle.outcome == 'failure') }}
        continue-on-error: true
        run: ccache --show-stats

      - name: Save Ladybird compiler and vcpkg archives
        # These caches validate content, so completed entries from an otherwise failed build are useful.
        if: ${{ always() && (steps.bundle.outcome == 'success' || steps.bundle.outcome == 'failure') }}
        uses: actions/cache/save@v4
        with:
          path: |
            .release-ccache
            .git/modules/Build/caches/vcpkg-binary-cache
          key: ${{ steps.native-cache.outputs.cache-primary-key }}

      - name: Smoke test the packaged browser
        run: |
          prefix=build/linux/Elaris
          # A copy outside the build tree proves the bundle does not depend on it.
          relocated="$RUNNER_TEMP/relocated"
          rm -rf "$relocated" && mkdir -p "$relocated" && cp -a "$prefix" "$relocated/Elaris"
          export LIBGL_ALWAYS_SOFTWARE=1
          xvfb-run --auto-servernum "$relocated/Elaris/bin/elaris" "file://$GITHUB_WORKSPACE/bridge/tests/smoke.html" -- --snap "$RUNNER_TEMP/smoke.png"
          test -s "$RUNNER_TEMP/smoke.png"

      - name: Check the Linux glibc baseline
        run: python3 packaging/linux/check-glibc-baseline.py build/linux/Elaris 2.39

      - name: Save verified Ladybird release outputs
        if: ${{ steps.engine-key.outputs.key != '' && steps.engine-cache.outputs.cache-hit != 'true' && hashFiles('build/release-engine-cache/manifest.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: build/release-engine-cache
          key: ${{ steps.engine-key.outputs.key }}

      - name: Package Linux archives and checksums
        run: |
          version="$ELARIS_VERSION"
          mkdir -p dist
          archive="dist/Elaris-${version}-linux-x86_64.tar.gz"
          image="dist/Elaris-${version}-linux-x86_64.AppImage"
          # Fixed owners, names and times, and no gzip name or time, so the same build always gives the same archive.
          epoch="$(git log -1 --format=%ct)"
          ladybird_revision="$(git rev-parse HEAD:vendor/ladybird)"
          tar -C build/linux --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${epoch}" -cf - Elaris | gzip -n > "$archive"
          cat > dist/BUILD-INFO.txt <<EOF
          Elaris ${version} (Linux x86_64)
          Elaris commit: ${GITHUB_SHA}
          Ladybird commit: ${ladybird_revision}
          Rune revision: $(grep -m1 'rev = ' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          Container: ghcr.io/ladybirdbrowser/ladybird-ci:2026.11.12
          EOF
          if [ -f build/release-engine-info.txt ]; then
            cat build/release-engine-info.txt >> dist/BUILD-INFO.txt
          else
            echo "Native engine: built natively (exact cache unavailable)" >> dist/BUILD-INFO.txt
          fi
          cp dist/BUILD-INFO.txt "dist/Elaris-${version}-linux-x86_64.BUILD-INFO.txt"
          (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")

          tool="$RUNNER_TEMP/appimagetool-x86_64.AppImage"
          curl --fail --location --retry 3 --output "$tool" \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          packaging/linux/make-appimage.sh build/linux/Elaris "$image" "$tool"
          (cd dist && sha256sum "$(basename "$image")" > "$(basename "$image").sha256")

          APPIMAGE_EXTRACT_AND_RUN=1 "$image" \
            "file://$GITHUB_WORKSPACE/bridge/tests/smoke.html" -- \
            --snap "$RUNNER_TEMP/appimage-smoke.png"
          test -s "$RUNNER_TEMP/appimage-smoke.png"

      - name: Keep the install prefix even if packaging failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elaris-linux-x86_64-build
          path: build/linux/Elaris
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: elaris-linux-x86_64
          path: dist/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish draft pre-release
    needs: [macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: elaris-macos-arm64
          path: dist/macos
      - uses: actions/download-artifact@v4
        with:
          name: elaris-linux-x86_64
          path: dist/linux

      - name: Create a draft pre-release with the artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          shopt -s nullglob
          mac=(dist/macos/Elaris-*-macos-arm64.dmg)
          linux=(dist/linux/Elaris-*-linux-x86_64.tar.gz)
          appimage=(dist/linux/Elaris-*-linux-x86_64.AppImage)
          if (( ${#mac[@]} != 1 || ${#linux[@]} != 1 || ${#appimage[@]} != 1 )); then
            echo "Expected one macOS DMG, one Linux tarball and one Linux AppImage" >&2
            exit 1
          fi
          mac_package="${mac[0]}"
          linux_package="${linux[0]}"
          appimage_package="${appimage[0]}"
          assets=("$mac_package" "$mac_package.sha256" "${mac_package%.dmg}.BUILD-INFO.txt"
                  "$linux_package" "$linux_package.sha256" "${linux_package%.tar.gz}.BUILD-INFO.txt"
                  "$appimage_package" "$appimage_package.sha256" "${appimage_package%.AppImage}.BUILD-INFO.txt")
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" || ! -s "$asset" ]]; then
              echo "Missing or empty release asset: $asset" >&2
              exit 1
            fi
          done
          # Drafts stay private until someone checks the artifacts and publishes them by hand.
          gh release create "$TAG" "${assets[@]}" \
            --draft --prerelease \
            --title "Elaris ${TAG} (experimental alpha)" \
            --notes "Experimental alpha builds of Elaris. Each archive ships Ladybird's engine; see the platform's BUILD-INFO.txt file for the exact Elaris, Ladybird and Rune revisions and verify the .sha256 checksum before running."

  publish-canary:
    name: Publish rolling canary pre-release
    needs: [macos, linux]
    if: inputs.channel == 'canary'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: elaris-macos-arm64
          path: dist/macos
      - uses: actions/download-artifact@v4
        with:
          name: elaris-linux-x86_64
          path: dist/linux

      - name: Replace the canary pre-release with tonight's builds
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          shopt -s nullglob
          mac=(dist/macos/Elaris-*-macos-arm64.dmg)
          linux=(dist/linux/Elaris-*-linux-x86_64.tar.gz)
          appimage=(dist/linux/Elaris-*-linux-x86_64.AppImage)
          if (( ${#mac[@]} != 1 || ${#linux[@]} != 1 || ${#appimage[@]} != 1 )); then
            echo "Expected one macOS DMG, one Linux tarball and one Linux AppImage" >&2
            exit 1
          fi
          mac_package="${mac[0]}"
          linux_package="${linux[0]}"
          appimage_package="${appimage[0]}"
          assets=("$mac_package" "$mac_package.sha256" "${mac_package%.dmg}.BUILD-INFO.txt"
                  "$linux_package" "$linux_package.sha256" "${linux_package%.tar.gz}.BUILD-INFO.txt"
                  "$appimage_package" "$appimage_package.sha256" "${appimage_package%.AppImage}.BUILD-INFO.txt")
          for asset in "${assets[@]}"; do
            if [[ ! -f "$asset" || ! -s "$asset" ]]; then
              echo "Missing or empty release asset: $asset" >&2
              exit 1
            fi
          done
          # The canary tag always names the newest build, so the previous one is replaced rather than kept.
          gh release delete canary --cleanup-tag --yes 2>/dev/null || true
          gh release create canary "${assets[@]}" \
            --target "$SHA" \
            --prerelease --latest=false \
            --title "Elaris canary ($(date -u +%Y-%m-%d))" \
            --notes "Built nightly from main at ${SHA:0:7}. Canary builds are unreleased and may break; they share the stable profile, so back up your data first. See the platform's BUILD-INFO.txt file for the exact revisions and verify the .sha256 checksum before running."
